version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: none
  enable:
    # Bugs & correctness
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - durationcheck

    # Style & conventions
    - revive
    - unconvert
    - unparam
    - unused
    - misspell
    - prealloc

    # Conventions this repo enforces rather than reviews
    - depguard

    # Security
    - gosec
    - nilnil
    - makezero
    - mirror

  settings:
    depguard:
      rules:
        # A process that calls logger.SetDefault also redirects the standard log
        # package through the slog handler at Info level, so a log.Fatal in one
        # of them is reported at INFO — the least severe event the process can
        # emit carrying the most severe meaning. cmd/seed is exempt: it never
        # installs the slog default, so its log.Printf is ordinary CLI output
        # going straight to stderr.
        no-standard-logger:
          files:
            - "$all"
            - "!**/pkg/logger/**"
            - "!**/cmd/seed/**"
          deny:
            - pkg: "log"
              desc: "use pkg/logger; the standard log package is redirected through slog at Info level"
            - pkg: "log/slog"
              desc: "use pkg/logger, which wraps slog and owns the handler configuration"

    revive:
      rules:
        - name: exported
          disabled: true
        - name: unexported-return
          disabled: true

    gosec:
      excludes:
        - G104 # unhandled errors — errcheck covers this
        - G304 # file path from variable — we control paths

    govet:
      enable-all: true
      disable:
        - fieldalignment

  exclusions:
    # sqlc-generated files
    paths:
      - "internal/feature/.*/db/.*\\.go"
      - ".*_test\\.go"

    rules:
      # Allow dot imports in test files
      - linters:
          - revive
        path: "_test\\.go"
        text: "dot-imports"

      # Test files use httptest.NewRequest which noctx flags; context is irrelevant in tests
      - linters:
          - noctx
        path: _test\.go

      # Allow unused params in interface implementations
      - linters:
          - unparam
        text: "always receives"

output:
  formats:
    text:
      print-linter-name: true
      colors: true
  sort-order:
    - file
