name: CD

# Manual, and it deploys a tag or a commit rather than whatever landed on main.
#
# It used to fire on every CI success on main, which made "merged" and "deployed"
# the same event: nobody chose when a deploy happened, and the only way to not
# deploy something was to not merge it. Naming the tag or commit here is the choice.
#
# Deliberately not `push: tags: ['v*']` — that is automation again, with tag
# creation as its trigger, and a mistyped or premature tag would deploy on its own.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag (e.g. v0.3.1) or commit SHA on main (short or full) to deploy. Its commit must have a green CI run.'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # gh run list queries the Actions API for the commit's CI result.
      actions: read
    outputs:
      app_digest: ${{ steps.build.outputs.digest }}
      backup_digest: ${{ steps.build_backup.outputs.digest }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # Resolved through the API before checkout: actions/checkout fetches a tag
      # or a full SHA, not a short one, and a branch name is a moving target
      # rather than a choice, so only a tag or a commit is accepted.
      #
      # The old trigger could not run without a green CI, so that guarantee came
      # for free. A dispatch can name anything, so the check has to be made
      # explicitly or this workflow would happily deploy a commit that never
      # passed anything.
      - name: Resolve the ref and require a green CI run for its commit
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Only the existence probe is silenced: its 404 is the "not a tag" answer.
          # The lookups below keep their errors, so a rate limit or an ambiguous
          # short SHA fails with GitHub's reason rather than as "not a SHA".
          if gh api "repos/$REPO/git/ref/tags/$REF" --silent 2>/dev/null; then
            echo "tag=$REF" >> "$GITHUB_OUTPUT"
            echo "version=$REF" >> "$GITHUB_OUTPUT"
            # Fully qualified: a branch of the same name would otherwise win.
            sha="$(gh api "repos/$REPO/commits/refs/tags/$REF" --jq .sha)"
          elif [[ "$REF" =~ ^[0-9a-f]{7,40}$ ]]; then
            sha="$(gh api "repos/$REPO/commits/$REF" --jq .sha)"
            echo "version=$sha" >> "$GITHUB_OUTPUT"
            # A bare commit carries no release decision of its own, so it has to
            # be one main already accepted — not a PR head that merely passed CI.
            status="$(gh api "repos/$REPO/compare/main...$sha" --jq .status)"
            if [ "$status" != behind ] && [ "$status" != identical ]; then
              echo "$sha is not on main (compare: $status). Merge it or tag it first." >&2
              exit 1
            fi
          else
            echo "'$REF' is neither a tag nor a commit SHA in $REPO." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $REF -> $sha"
          conclusions="$(gh run list --workflow CI --commit "$sha" --repo "$REPO" --json conclusion --jq '.[].conclusion')"
          if [ -z "$conclusions" ]; then
            echo "No CI run recorded for $sha. Push the commit through CI first." >&2
            exit 1
          fi
          grep -Fxq success <<< "$conclusions" || {
            echo "No successful CI run for $sha; saw: $conclusions" >&2
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build app for smoke tests
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: darkvoid:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build backup for smoke tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backup/Dockerfile
          load: true
          tags: darkvoid-backup:ci
          cache-from: type=gha,scope=backup
          cache-to: type=gha,scope=backup,mode=max

      - name: Test runtime images before publishing
        run: make test-container-runtime APP_TEST_IMAGE=darkvoid:ci BACKUP_TEST_IMAGE=darkvoid-backup:ci

      - name: Test fresh stack and safe migrations
        run: make test-compose-integration APP_TEST_IMAGE=darkvoid:ci

      - name: Publish app by tested commit
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.resolve.outputs.sha }}
            ${{ steps.resolve.outputs.tag && format('{0}/{1}:{2}', env.REGISTRY, env.IMAGE_NAME, steps.resolve.outputs.tag) || '' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.resolve.outputs.sha }}
            org.opencontainers.image.version=${{ steps.resolve.outputs.version }}

      - name: Publish backup by tested commit
        id: build_backup
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backup/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backup:${{ steps.resolve.outputs.sha }}
            ${{ steps.resolve.outputs.tag && format('{0}/{1}-backup:{2}', env.REGISTRY, env.IMAGE_NAME, steps.resolve.outputs.tag) || '' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.resolve.outputs.sha }}
            org.opencontainers.image.version=${{ steps.resolve.outputs.version }}

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    environment: development
    concurrency:
      group: darkvoid-deploy-development
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: /opt/darkvoid-dev
      RELEASE_ID: ${{ needs.build_and_push.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build_and_push.outputs.sha }}
          fetch-depth: 0

      - name: Package immutable release
        env:
          RELEASE_COMMIT: ${{ needs.build_and_push.outputs.sha }}
          # This workflow's own run_number, not CI's. deploy-release.sh refuses a
          # sequence lower than the deployed one, so the counter must not change
          # again after this: CD is at 39 where CI was at 64, and had a release
          # ever been recorded under CI's numbering the first dispatched deploy would
          # have been rejected as "older". Nothing is recorded yet — there is no
          # current symlink on the host — so this switch sets the baseline rather
          # than colliding with one. Renaming this workflow would reset the
          # counter and start refusing deploys; don't.
          RELEASE_SEQUENCE: ${{ github.run_number }}
          APP_DIGEST: ${{ needs.build_and_push.outputs.app_digest }}
          BACKUP_DIGEST: ${{ needs.build_and_push.outputs.backup_digest }}
        run: bash scripts/create-release.sh release "$RELEASE_COMMIT" "$RELEASE_SEQUENCE" "$APP_DIGEST" "$BACKUP_DIGEST"

      - name: Upload candidate without changing the current release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "release/**"
          target: ${{ env.DEPLOY_DIR }}/incoming/${{ env.RELEASE_ID }}
          strip_components: 1

      - name: Deploy and verify candidate
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          RELEASE_ID: ${{ env.RELEASE_ID }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: DEPLOY_DIR,RELEASE_ID,REGISTRY_TOKEN,REGISTRY_USER
          command_timeout: 45m
          script: |
            set -eu
            command -v jq
            command -v flock
            command -v curl
            printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            trap 'docker logout ghcr.io' EXIT
            bash "$DEPLOY_DIR/incoming/$RELEASE_ID/scripts/deploy-release.sh" \
              "$DEPLOY_DIR" "$DEPLOY_DIR/incoming/$RELEASE_ID"
            for wrapper in dv dvctl; do
              sudo install -m 755 "$DEPLOY_DIR/current/scripts/$wrapper" "/usr/local/bin/$wrapper"
            done
