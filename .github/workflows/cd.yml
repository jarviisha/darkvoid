name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build_and_push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app_digest: ${{ steps.build.outputs.digest }}
      backup_digest: ${{ steps.build_backup.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build app for smoke tests
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: darkvoid:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build backup for smoke tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backup/Dockerfile
          load: true
          tags: darkvoid-backup:ci
          cache-from: type=gha,scope=backup
          cache-to: type=gha,scope=backup,mode=max

      - name: Test runtime images before publishing
        run: make test-container-runtime APP_TEST_IMAGE=darkvoid:ci BACKUP_TEST_IMAGE=darkvoid-backup:ci

      - name: Test fresh stack and safe migrations
        run: make test-compose-integration APP_TEST_IMAGE=darkvoid:ci

      - name: Publish app by tested commit
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - name: Publish backup by tested commit
        id: build_backup
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backup/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backup:${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    environment: development
    concurrency:
      group: darkvoid-deploy-development
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: /opt/darkvoid-dev
      RELEASE_ID: ${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Package immutable release
        env:
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          RELEASE_SEQUENCE: ${{ github.event.workflow_run.run_number }}
          APP_DIGEST: ${{ needs.build_and_push.outputs.app_digest }}
          BACKUP_DIGEST: ${{ needs.build_and_push.outputs.backup_digest }}
        run: bash scripts/create-release.sh release "$RELEASE_COMMIT" "$RELEASE_SEQUENCE" "$APP_DIGEST" "$BACKUP_DIGEST"

      - name: Upload candidate without changing the current release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "release/**"
          target: ${{ env.DEPLOY_DIR }}/incoming/${{ env.RELEASE_ID }}
          strip_components: 1

      - name: Deploy and verify candidate
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          RELEASE_ID: ${{ env.RELEASE_ID }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: DEPLOY_DIR,RELEASE_ID,REGISTRY_TOKEN,REGISTRY_USER
          command_timeout: 45m
          script: |
            set -eu
            command -v jq
            command -v flock
            command -v curl
            printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            trap 'docker logout ghcr.io' EXIT
            bash "$DEPLOY_DIR/incoming/$RELEASE_ID/scripts/deploy-release.sh" \
              "$DEPLOY_DIR" "$DEPLOY_DIR/incoming/$RELEASE_ID"
            for wrapper in dv dvctl; do
              sudo install -m 755 "$DEPLOY_DIR/current/scripts/$wrapper" "/usr/local/bin/$wrapper"
            done
