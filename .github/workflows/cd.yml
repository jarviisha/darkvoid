name: CD

# Runs after the CI workflow succeeds on main (never on PRs).
on:
  workflow_run:
    workflows: [CI]
    types:
      - completed
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEPLOY_DIR: darkvoid

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Copy docker-compose and migrations to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "docker-compose.prod.yml,migrations/**"
          target: $HOME/${{ env.DEPLOY_DIR }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd $HOME/darkvoid

            # docker-compose.codohue.yml is a server-local override that
            # attaches the app to the codohue stack; use it when present.
            COMPOSE="docker compose -f docker-compose.prod.yml"
            if [ -f docker-compose.codohue.yml ]; then
              COMPOSE="$COMPOSE -f docker-compose.codohue.yml"
            fi

            # GITHUB_TOKEN is valid for this run only and can read the
            # repo-linked package — no long-lived PAT on the server.
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            $COMPOSE pull app

            # Migrations run automatically: the migrate-user → migrate-post →
            # migrate-notification chain gates the app via depends_on.
            $COMPOSE up -d

            docker logout ghcr.io
            docker image prune -f

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd $HOME/darkvoid

            echo "Waiting for the app container to be healthy..."
            for i in $(seq 1 24); do
              STATUS=$(docker inspect --format '{{.State.Health.Status}}' darkvoid-app-1 2>/dev/null || echo "missing")
              echo "  attempt $i: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                break
              fi
              if [ "$i" = "24" ]; then
                echo "App container never became healthy:"
                docker logs darkvoid-app-1 --tail 50
                exit 1
              fi
              sleep 5
            done

            echo ""
            echo "=== Health Check ==="
            curl -sf http://localhost:8080/health

            echo ""
            echo "Deployment verified successfully."
