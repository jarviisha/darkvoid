name: CD

# Runs after the CI workflow succeeds on main (never on PRs).
on:
  workflow_run:
    workflows: [CI]
    types:
      - completed
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Extract backup image metadata
        id: backup-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backup
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push backup image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backup/Dockerfile
          push: true
          tags: ${{ steps.backup-meta.outputs.tags }}
          labels: ${{ steps.backup-meta.outputs.labels }}

  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    needs: build-and-push
    # main deploys to development. When a production environment lands, switch
    # to the codohue pattern: pick environment + DEPLOY_DIR off head_branch/tag.
    environment: development
    env:
      DEPLOY_DIR: /opt/darkvoid-dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Copy docker-compose and migrations to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "docker-compose.prod.yml,docker-compose.codohue.yml,migrations/**,scripts/**"
          target: ${{ env.DEPLOY_DIR }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ${{ env.DEPLOY_DIR }}

            # docker-compose.codohue.yml attaches the app to a Codohue stack
            # running as its own compose project. It ships with the repo, so it
            # is now on every deployment and its presence no longer says whether
            # this one wants it — gate on COMPOSE_FILE in the deployment's .env,
            # which is where that intent is already declared and what a bare
            # `docker compose` on the box already honours. Guessing from the file
            # being there would attach every future environment to a codohue
            # network it has no reason to have.
            COMPOSE="docker compose -f docker-compose.prod.yml"
            if grep -qs 'docker-compose\.codohue\.yml' .env; then
              COMPOSE="$COMPOSE -f docker-compose.codohue.yml"
            fi

            # GITHUB_TOKEN is valid for this run only and can read the
            # repo-linked package — no long-lived PAT on the server.
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            $COMPOSE pull app pg-backup

            # Migrations run automatically: app depends_on the tail of the
            # migrate-* chain with service_completed_successfully, so it only
            # starts once every module has migrated. Deliberately not naming the
            # modules — this comment listed three of them long after there were
            # five, and a deploy step that describes the wrong chain is worse
            # than one that describes the mechanism.
            $COMPOSE up -d

            # Install the operator wrappers system-wide so they stay in sync with
            # the repo (no more hand-edited /usr/local/bin scripts). dv is the
            # compose entrypoint: it carries the server-local override files that
            # a hand-typed -f leaves out.
            for wrapper in dvctl dv; do
              if [ -f "scripts/$wrapper" ]; then
                sudo install -m 755 "scripts/$wrapper" "/usr/local/bin/$wrapper"
              fi
            done

            docker logout ghcr.io
            docker image prune -f

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ${{ env.DEPLOY_DIR }}

            COMPOSE="docker compose -f docker-compose.prod.yml"
            if grep -qs 'docker-compose\.codohue\.yml' .env; then
              COMPOSE="$COMPOSE -f docker-compose.codohue.yml"
            fi
            APP_CID=$($COMPOSE ps -q app)

            echo "Waiting for the app container to be healthy..."
            for i in $(seq 1 24); do
              STATUS=$(docker inspect --format '{{.State.Health.Status}}' "$APP_CID" 2>/dev/null || echo "missing")
              echo "  attempt $i: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                break
              fi
              if [ "$i" = "24" ]; then
                echo "App container never became healthy:"
                docker logs "$APP_CID" --tail 50
                exit 1
              fi
              sleep 5
            done

            echo ""
            echo "=== Health Check ==="
            curl -sf http://localhost:8080/health

            echo ""
            echo "Deployment verified successfully."
