name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Separate from test: it needs neither Redis nor the S3 store, and CD gates on
  # the whole workflow, so a lint failure blocks the deploy without having to
  # wait for the integration services to come up.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Installed from the Makefile's pinned version rather than through a
      # linting action, so CI runs the same binary and the same command as
      # `make lint` on a developer's machine. A second place to bump the version
      # is a second place for it to disagree.
      - name: Install golangci-lint
        run: |
          make install-lint
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run lint
        run: make lint

      # go.mod drifts quietly: deleting a file can leave a require line with no
      # importer, and nothing fails — the next `make deps` then lands an unrelated
      # dependency diff in whoever's commit runs it first. Same shape as the sqlc
      # reproducibility check in the test job.
      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run vet
        run: go vet ./...

      # s3mock, not MinIO: MinIO withdrew the community distribution. Both
      # `minio/minio` and `quay.io/minio/minio` now answer "unauthorized" for
      # every tag including `latest`, and dl.min.io serves 410 for the server
      # binary, so there is no registry swap left to make. s3mock is an S3 API
      # mock built for tests — it ignores credentials, which is why the root
      # user env vars are gone; the test still sends keys and s3mock accepts
      # any. It listens on 9090, published as 9000 so S3_TEST_ENDPOINT below is
      # unchanged. Unauthenticated `GET /` (ListBuckets) replaces the MinIO
      # health path, which s3mock does not serve.
      - name: Start S3-compatible integration store
        run: |
          docker run --detach --rm --name darkvoid-ci-s3 \
            --publish 9000:9090 \
            adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
          for _attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs darkvoid-ci-s3
          exit 1

      - name: Run tests
        env:
          REDIS_TEST_ADDR: 127.0.0.1:6379
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_ACCESS_KEY_ID: darkvoid-test
          S3_TEST_SECRET_ACCESS_KEY: darkvoid-test-secret
        run: go test -race ./...

      - name: Stop S3-compatible integration store
        if: always()
        run: docker stop darkvoid-ci-s3 || true

      - name: Test production operation contracts
        run: make test-ops

      - name: Test migration round trip on PostgreSQL
        run: make test-migrations

      - name: Verify SQLC generation is reproducible
        run: |
          make install-sqlc
          make sqlc-generate
          git diff --exit-code -- internal/feature/*/db
