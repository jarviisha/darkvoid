# App-only by default. Use make docker-up for the local infrastructure overlay.
# .env is interpolation input only: services receive this explicit allowlist.
x-deployment:
  files: "${DARKVOID_COMPOSE:-${COMPOSE_FILE:-}}"
  profiles: "${COMPOSE_PROFILES:-}"
  app_timeout: "${DEPLOY_APP_TIMEOUT:-180}"
  backup_timeout: "${DEPLOY_BACKUP_TIMEOUT:-1800}"
  require_backup: "${DEPLOY_REQUIRE_BACKUP:-false}"

x-app-environment: &app-environment
  SERVICE_NAME: "${SERVICE_NAME:-}"
  SERVICE_VERSION: "${SERVICE_VERSION:-}"
  ENVIRONMENT: "${ENVIRONMENT:-development}"
  DB_HOST: "${EXTERNAL_DB_HOST:-${DB_HOST:-host.docker.internal}}"
  DB_PORT: "${EXTERNAL_DB_PORT:-${DB_PORT:-5432}}"
  DB_USER: "${DB_USER:-}"
  DB_PASSWORD: "${DB_PASSWORD:-}"
  DB_NAME: "${DB_NAME:-}"
  DB_SSLMODE: "${EXTERNAL_DB_SSLMODE:-${DB_SSLMODE:-disable}}"
  DB_MAX_CONNS: "${DB_MAX_CONNS:-}"
  DB_MIN_CONNS: "${DB_MIN_CONNS:-}"
  DB_MAX_CONN_LIFETIME: "${DB_MAX_CONN_LIFETIME:-}"
  DB_MAX_CONN_IDLE_TIME: "${DB_MAX_CONN_IDLE_TIME:-}"
  LOG_LEVEL: "${LOG_LEVEL:-}"
  LOG_FORMAT: "${LOG_FORMAT:-}"
  LOG_ADD_SOURCE: "${LOG_ADD_SOURCE:-}"
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  SERVER_READ_TIMEOUT: "${SERVER_READ_TIMEOUT:-}"
  SERVER_WRITE_TIMEOUT: "${SERVER_WRITE_TIMEOUT:-}"
  SERVER_IDLE_TIMEOUT: "${SERVER_IDLE_TIMEOUT:-}"
  SERVER_REQUEST_TIMEOUT: "${SERVER_REQUEST_TIMEOUT:-}"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
  TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
  RATE_LIMIT_REQUESTS: "${RATE_LIMIT_REQUESTS:-}"
  RATE_LIMIT_WINDOW: "${RATE_LIMIT_WINDOW:-}"
  COOKIE_SAMESITE: "${COOKIE_SAMESITE:-}"
  COOKIE_DOMAIN: "${COOKIE_DOMAIN:-}"
  COOKIE_SECURE: "${COOKIE_SECURE:-}"
  STORAGE_PROVIDER: "${STORAGE_PROVIDER:-}"
  STORAGE_BASE_URL: "${STORAGE_BASE_URL:-http://localhost:${APP_HOST_PORT:-${SERVER_PORT:-8080}}/static}"
  STORAGE_LOCAL_DIR: "/app/uploads"
  STORAGE_S3_ENDPOINT: "${STORAGE_S3_ENDPOINT:-}"
  STORAGE_S3_REGION: "${STORAGE_S3_REGION:-}"
  STORAGE_S3_BUCKET: "${STORAGE_S3_BUCKET:-}"
  STORAGE_S3_ACCESS_KEY_ID: "${STORAGE_S3_ACCESS_KEY_ID:-}"
  STORAGE_S3_SECRET_ACCESS_KEY: "${STORAGE_S3_SECRET_ACCESS_KEY:-}"
  STORAGE_S3_SESSION_TOKEN: "${STORAGE_S3_SESSION_TOKEN:-}"
  STORAGE_S3_USE_PATH_STYLE: "${STORAGE_S3_USE_PATH_STYLE:-}"
  # Optional AWS default credential chain; backup credentials use BACKUP_* only.
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
  AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
  AWS_REGION: "${AWS_REGION:-}"
  AWS_ROLE_ARN: "${AWS_ROLE_ARN:-}"
  AWS_WEB_IDENTITY_TOKEN_FILE: "${AWS_WEB_IDENTITY_TOKEN_FILE:-}"
  JWT_SECRET: "${JWT_SECRET:-darkvoid-dev-secret}"
  JWT_ISSUER: "${JWT_ISSUER:-}"
  JWT_AUDIENCE: "${JWT_AUDIENCE:-}"
  JWT_ACCESS_TOKEN_EXPIRY: "${JWT_ACCESS_TOKEN_EXPIRY:-}"
  REFRESH_TOKEN_EXPIRY: "${REFRESH_TOKEN_EXPIRY:-}"
  ROOT_EMAIL: "${ROOT_EMAIL:-}"
  ROOT_PASSWORD: "${ROOT_PASSWORD:-}"
  ROOT_USERNAME: "${ROOT_USERNAME:-}"
  ROOT_DISPLAY_NAME: "${ROOT_DISPLAY_NAME:-}"
  CODOHUE_ENABLED: "${CODOHUE_ENABLED:-}"
  CODOHUE_BASE_URL: "${CODOHUE_DOCKER_BASE_URL:-${EXTERNAL_CODOHUE_BASE_URL:-${CODOHUE_BASE_URL:-http://host.docker.internal:2001}}}"
  CODOHUE_ADMIN_URL: "${CODOHUE_DOCKER_ADMIN_URL:-${EXTERNAL_CODOHUE_ADMIN_URL:-${CODOHUE_ADMIN_URL:-http://host.docker.internal:2002}}}"
  CODOHUE_NAMESPACE_KEY: "${CODOHUE_NAMESPACE_KEY:-}"
  CODOHUE_ADMIN_KEY: "${CODOHUE_ADMIN_KEY:-${CODOHUE_API_KEY:-}}"
  CODOHUE_NAMESPACE: "${CODOHUE_NAMESPACE:-}"
  CODOHUE_EMBEDDING_DIM: "${CODOHUE_EMBEDDING_DIM:-}"
  CODOHUE_EVENTS_REDIS_HOST: "${CODOHUE_EVENTS_REDIS_HOST:-}"
  CODOHUE_EVENTS_REDIS_PORT: "${CODOHUE_EVENTS_REDIS_PORT:-}"
  CODOHUE_EVENTS_REDIS_PASSWORD: "${CODOHUE_EVENTS_REDIS_PASSWORD:-}"
  CODOHUE_EVENTS_REDIS_DB: "${CODOHUE_EVENTS_REDIS_DB:-}"
  MAILER_PROVIDER: "${MAILER_PROVIDER:-}"
  MAILER_HOST: "${MAILER_HOST:-}"
  MAILER_PORT: "${MAILER_PORT:-}"
  MAILER_USERNAME: "${MAILER_USERNAME:-}"
  MAILER_PASSWORD: "${MAILER_PASSWORD:-}"
  RESEND_API_KEY: "${RESEND_API_KEY:-}"
  RESEND_WEBHOOK_SECRET: "${RESEND_WEBHOOK_SECRET:-}"
  MAILER_FROM: "${MAILER_FROM:-}"
  MAILER_BASE_URL: "${MAILER_BASE_URL:-}"
  REDIS_HOST: "${EXTERNAL_REDIS_HOST:-${REDIS_HOST:-host.docker.internal}}"
  REDIS_PORT: "${EXTERNAL_REDIS_PORT:-${REDIS_PORT:-6379}}"
  REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
  REDIS_DB: "${REDIS_DB:-}"
  REDIS_POOL_SIZE: "${REDIS_POOL_SIZE:-}"
  FEED_FANOUT_WORKERS: "${FEED_FANOUT_WORKERS:-}"
  FEED_FANOUT_QUEUE_SIZE: "${FEED_FANOUT_QUEUE_SIZE:-}"
  SETTINGS_REFRESH_INTERVAL: "${SETTINGS_REFRESH_INTERVAL:-}"

x-runtime: &runtime
  image: ${LOCAL_APP_IMAGE:-darkvoid-app:latest}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  environment: *app-environment

services:
  app:
    <<: *runtime
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - "${SERVER_BIND:-127.0.0.1}:${APP_HOST_PORT:-${SERVER_PORT:-8080}}:8080"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ctl:
    <<: *runtime
    profiles: [tools]
    restart: "no"
    entrypoint: ["/app/darkvoidctl"]

  seed:
    <<: *runtime
    profiles: [tools]
    restart: "no"
    entrypoint: ["/app/seed"]
    command:
      - "--posts=${SEED_POSTS:-500}"
      - "--likes-per-post=${SEED_LIKES_PER_POST:-40}"
      - "--comments-per-post=${SEED_COMMENTS_PER_POST:-5}"

volumes:
  uploads:
