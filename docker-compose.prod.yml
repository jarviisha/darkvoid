# Production: pull pre-built image from ghcr.io
#
# Usage: dv up -d
#
# Deliberately not `docker compose -f docker-compose.prod.yml up -d`. A deployment
# may carry server-local override files that this repo does not ship — the dev box
# has docker-compose.codohue.yml, which attaches the app to the codohue stack's
# network and Redis. Leaving one out does not fail loudly: it recreates the app
# against a different stack, and the app decides at boot whether codohue is
# reachable, so it then runs with indexing off behind a single startup warning.
#
# `dv` (scripts/dv, installed system-wide by CD) always passes the full file list.
# COMPOSE_FILE in .env covers a bare `docker compose`, but an explicit -f overrides
# it — which is what a copy-pasted command carries.
#
# Requires production secrets in .env or the shell.
#
# Rollback: CD tags every image with its commit SHA as well as `latest`, so
# pinning the tag is all a rollback needs — no edit to this file:
#   echo 'APP_TAG=<sha>' >> .env && dv up -d app
# Leaving APP_TAG unset keeps the previous behaviour (`latest`).

# ---------------------------------------------------------------------------
# Shared fragments
# ---------------------------------------------------------------------------

# Without this every container's stdout accumulates in an unbounded json-file on
# the host until the disk fills — the failure takes the whole box, not one
# service, and it takes out Postgres with it. 10m x 3 caps the stack at ~30MB per
# container while still holding enough history to debug a crash loop.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Containers here never need to gain privileges via setuid binaries; the app
# image already runs as an unprivileged user. Costs nothing, closes one
# escalation path if a service is ever compromised.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

# The four migration services differ only in which directory they apply and
# which version table they record it in — everything else is identical, so it
# lives here. Adding a module is now a ~10-line service, not a ~20-line copy.
x-migrate: &migrate
  image: migrate/migrate:4
  # Bounded, not bare `on-failure`. An unbounded restart on a genuinely broken
  # migration (bad SQL, dirty version) retries forever, and because the app gates
  # on service_completed_successfully the deploy hangs instead of failing — with
  # no error surfaced to CD. A bounded count lets compose exit non-zero so
  # `set -e` in cd.yml catches it. Dependencies are started before the app is
  # recreated, so a failure here leaves the running app untouched.
  restart: on-failure:5
  logging: *logging
  <<: *hardening
  volumes:
    - ./migrations:/migrations:ro
  environment:
    # Out of band rather than inside the -database URL: a credential in argv is
    # visible to anyone who can run `docker inspect`, and a password inside a
    # postgres:// string is what secret scanners match on — by shape, whatever
    # value sits there. lib/pq reads PGPASSWORD, verified against migrate/migrate:4.
    PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}

x-redis-command: &redis-command
  - sh
  - -c
  - |
    if [ -n "$$REDIS_PASSWORD" ]; then
      exec redis-server \
        --requirepass "$$REDIS_PASSWORD" \
        --maxmemory "$$REDIS_MAXMEMORY" \
        --maxmemory-policy allkeys-lru
    fi
    exec redis-server \
      --maxmemory "$$REDIS_MAXMEMORY" \
      --maxmemory-policy allkeys-lru

x-redis-healthcheck: &redis-healthcheck
  # REDISCLI_AUTH rather than `-a`: same result, but redis-cli stops printing
  # "Using a password ... may not be safe" to stderr on every probe, which
  # otherwise fills `docker logs redis` with warnings that mean nothing. Set
  # inside the branch — an empty REDISCLI_AUTH is still "set", and redis-cli
  # would then send AUTH "" to a password-less server.
  test:
    [
      "CMD-SHELL",
      'if [ -n "$$REDIS_PASSWORD" ]; then REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping; else redis-cli ping; fi',
    ]
  interval: 5s
  timeout: 5s
  retries: 10

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    # A fast shutdown still has to checkpoint; killed at the 10s default, the
    # next start replays WAL instead of opening clean.
    stop_grace_period: 60s
    # The default 64MB /dev/shm is what parallel query workers allocate from —
    # "could not resize shared memory segment" under load is this, not a bug.
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-darkvoid}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-darkvoid}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      # First boot runs initdb, during which the bootstrap server accepts socket
      # connections before it is really up. Failures inside start_period do not
      # count against retries, so the migrate chain no longer burns restarts on
      # a cold volume.
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-1g}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    # Long enough to finish the shutdown RDB save.
    stop_grace_period: 30s
    command: *redis-command
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Redis holds only derived data here (following:ids, trending:posts) and
      # the notification pub/sub channel, so an unbounded instance grows until
      # the kernel OOM-kills it. Keep this comfortably below the container limit
      # below: eviction should be what reclaims memory, not the OOM killer, and
      # a background RDB save needs copy-on-write headroom.
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
    volumes:
      - redis_data:/data
    healthcheck: *redis-healthcheck
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-384m}

  # Migrations are serialized on purpose, not for lack of parallelism: golang-migrate
  # takes a session-level advisory lock keyed on the database, so running the four
  # modules concurrently would contend on that lock rather than overlap. Explicit
  # ordering also keeps post/notification behind the user schema they reference.
  migrate-user:
    <<: *migrate
    command:
      [
        "-path",
        "/migrations/user",
        "-database",
        "postgres://${DB_USER:-postgres}@postgres:5432/${DB_NAME:-darkvoid}?sslmode=disable&x-migrations-table=schema_migrations_user",
        "up",
      ]
    depends_on:
      postgres:
        condition: service_healthy

  migrate-post:
    <<: *migrate
    command:
      [
        "-path",
        "/migrations/post",
        "-database",
        "postgres://${DB_USER:-postgres}@postgres:5432/${DB_NAME:-darkvoid}?sslmode=disable&x-migrations-table=schema_migrations_post",
        "up",
      ]
    depends_on:
      migrate-user:
        condition: service_completed_successfully

  migrate-notification:
    <<: *migrate
    command:
      [
        "-path",
        "/migrations/notification",
        "-database",
        "postgres://${DB_USER:-postgres}@postgres:5432/${DB_NAME:-darkvoid}?sslmode=disable&x-migrations-table=schema_migrations_notification",
        "up",
      ]
    depends_on:
      migrate-post:
        condition: service_completed_successfully

  migrate-bot:
    <<: *migrate
    command:
      [
        "-path",
        "/migrations/bot",
        "-database",
        "postgres://${DB_USER:-postgres}@postgres:5432/${DB_NAME:-darkvoid}?sslmode=disable&x-migrations-table=schema_migrations_bot",
        "up",
      ]
    depends_on:
      migrate-notification:
        condition: service_completed_successfully

  migrate-settings:
    <<: *migrate
    command:
      [
        "-path",
        "/migrations/settings",
        "-database",
        "postgres://${DB_USER:-postgres}@postgres:5432/${DB_NAME:-darkvoid}?sslmode=disable&x-migrations-table=schema_migrations_settings",
        "up",
      ]
    depends_on:
      migrate-bot:
        condition: service_completed_successfully

  app:
    image: ${APP_IMAGE:-ghcr.io/jarviisha/darkvoid}:${APP_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    # cmd/api drains for up to 30s (GracefulShutdown(30*time.Second) in
    # cmd/api/main.go). Docker's default grace is 10s, so every deploy was
    # SIGKILLing the app mid-drain: in-flight requests cut, SSE streams dropped
    # without the broker's close, connections left for the client to notice.
    # 40s covers the full drain plus margin.
    stop_grace_period: 40s
    ports:
      # Bind address is a variable so a deployment that puts a reverse proxy in
      # front can keep the app off public interfaces without editing this file.
      # Opening it beyond loopback requires an explicit deployment decision.
      - "${SERVER_BIND:-127.0.0.1}:${SERVER_PORT:-8080}:8080"
    healthcheck:
      # GET, not --spider: /health only registers GET; wget --spider sends
      # HEAD, which chi answers with 405 and the check reports a broken link.
      # /health returns 503 when the DB ping fails, and wget exits non-zero on
      # 503 — so this tracks "can serve", not just "process is alive".
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    env_file:
      - path: .env
        required: false
    environment:
      # App
      ENVIRONMENT: ${ENVIRONMENT:-production}
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"

      # Database — points to the postgres container
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-darkvoid}
      DB_SSLMODE: disable

      # Redis — points to the redis container
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-10}

      # JWT
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}

      # Storage
      # Production is deliberately S3-only: a container-local/named volume is
      # not shared across hosts and makes rolling replacement lose media.
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:?set STORAGE_PROVIDER=s3}
      STORAGE_BASE_URL: ${STORAGE_BASE_URL:?set the public HTTPS CDN/object URL}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:?set the S3 region}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:?set the shared media bucket}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
      STORAGE_S3_SESSION_TOKEN: ${STORAGE_S3_SESSION_TOKEN:-}
      STORAGE_S3_USE_PATH_STYLE: ${STORAGE_S3_USE_PATH_STYLE:-false}
      # Mailer
      MAILER_PROVIDER: ${MAILER_PROVIDER:-nop}
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-768m}
          # Bounds a runaway goroutine/thread leak to this container instead of
          # letting it exhaust the host's process table. Generous: the pgx pool
          # is 25 and Go multiplexes goroutines onto far fewer OS threads.
          pids: ${APP_PIDS_LIMIT:-512}
    depends_on:
      # postgres is implied by the migrate chain; kept because it states the
      # app's own requirement rather than inheriting it from a migration detail.
      postgres:
        condition: service_healthy
      migrate-settings:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Operator CLI — same image as app, run as a one-off inside the compose
  # network (DB reachable by service name). Ships with every deploy, so no
  # hand-installed binary. Usage:
  #   docker compose -f docker-compose.prod.yml --profile tools run --rm ctl user list
  ctl:
    image: ${APP_IMAGE:-ghcr.io/jarviisha/darkvoid}:${APP_TAG:-latest}
    profiles: [tools]
    restart: "no"
    logging: *logging
    <<: *hardening
    entrypoint: ["/app/darkvoidctl"]
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-darkvoid}
      DB_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy

  # PostgreSQL backup is part of the production stack, not an operator profile.
  # Restic encrypts before uploading to a required remote repository. The
  # container also applies retention and periodically restores the newest dump
  # into an isolated database; only scheduler state/cache remains on this host.
  pg-backup:
    image: ${BACKUP_IMAGE:-ghcr.io/jarviisha/darkvoid-backup}:${APP_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    stop_grace_period: 30s
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      PGDATABASE: ${DB_NAME:-darkvoid}

      # The repository must be off-host (s3/sftp/rest+HTTPS/azure/gs).
      # Restic encrypts every snapshot with this independent backup secret.
      RESTIC_REPOSITORY: ${BACKUP_RESTIC_REPOSITORY:?set an off-host Restic repository}
      RESTIC_PASSWORD: ${BACKUP_RESTIC_PASSWORD:?set a dedicated Restic encryption password}
      RESTIC_CACHE_DIR: /state/cache

      # Separate least-privilege credentials are recommended for backup data.
      AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${BACKUP_AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${BACKUP_AWS_REGION:-us-east-1}

      BACKUP_ALERT_WEBHOOK_URL: ${BACKUP_ALERT_WEBHOOK_URL:?set an HTTPS backup alert webhook}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RESTORE_DRILL_INTERVAL_SECONDS: ${BACKUP_RESTORE_DRILL_INTERVAL_SECONDS:-604800}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
      BACKUP_RESTIC_TAG: ${BACKUP_RESTIC_TAG:-darkvoid-postgres}
      # Stable across container replacement so retention groups old/new cycles
      # together instead of treating every random container hostname separately.
      BACKUP_RESTIC_HOST: ${BACKUP_RESTIC_HOST:-darkvoid-production}
      BACKUP_RESTORE_DATABASE: ${BACKUP_RESTORE_DATABASE:-}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-172800}
      BACKUP_STATE_DIR: /state
    volumes:
      - backup_state:/state
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'test -r /state/last-success && now=$$(date +%s) && last=$$(cat /state/last-success) && test $$((now - last)) -le "$$BACKUP_MAX_AGE_SECONDS"',
        ]
      interval: 1m
      timeout: 10s
      retries: 3
      # The first backup and immediate restore drill can be large.
      start_period: ${BACKUP_START_PERIOD:-30m}
    depends_on:
      postgres:
        condition: service_healthy

# Named explicitly so server-local override files (docker-compose.codohue.yml)
# can join it by a stable name instead of the generated <project>_default, which
# changes with the deployment directory.
networks:
  default:
    name: ${COMPOSE_NETWORK_NAME:-darkvoid}

volumes:
  postgres_data:
  redis_data:
  # Scheduler timestamps and a disposable Restic cache only. Backup snapshots
  # live exclusively in RESTIC_REPOSITORY and survive loss of this host.
  backup_state:
