# Production: pull pre-built image from ghcr.io
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Requires production secrets in .env or the shell.

x-redis-command: &redis-command
  - sh
  - -c
  - |
    if [ -n "$$REDIS_PASSWORD" ]; then
      exec redis-server --requirepass "$$REDIS_PASSWORD"
    fi
    exec redis-server

x-redis-healthcheck: &redis-healthcheck
  test:
    [
      "CMD-SHELL",
      'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi',
    ]
  interval: 5s
  timeout: 5s
  retries: 10

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-darkvoid}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-darkvoid}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: *redis-command
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck: *redis-healthcheck

  migrate-user:
    image: migrate/migrate:4
    restart: on-failure
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations/user",
        "-database",
        "postgres://${DB_USER:-postgres}:${DB_PASSWORD:?set DB_PASSWORD in .env}@postgres:5432/${DB_NAME:-darkvoid}?sslmode=disable&x-migrations-table=schema_migrations_user",
        "up",
      ]
    depends_on:
      postgres:
        condition: service_healthy

  migrate-post:
    image: migrate/migrate:4
    restart: on-failure
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations/post",
        "-database",
        "postgres://${DB_USER:-postgres}:${DB_PASSWORD:?set DB_PASSWORD in .env}@postgres:5432/${DB_NAME:-darkvoid}?sslmode=disable&x-migrations-table=schema_migrations_post",
        "up",
      ]
    depends_on:
      migrate-user:
        condition: service_completed_successfully

  migrate-notification:
    image: migrate/migrate:4
    restart: on-failure
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations/notification",
        "-database",
        "postgres://${DB_USER:-postgres}:${DB_PASSWORD:?set DB_PASSWORD in .env}@postgres:5432/${DB_NAME:-darkvoid}?sslmode=disable&x-migrations-table=schema_migrations_notification",
        "up",
      ]
    depends_on:
      migrate-post:
        condition: service_completed_successfully

  migrate-bot:
    image: migrate/migrate:4
    restart: on-failure
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations/bot",
        "-database",
        "postgres://${DB_USER:-postgres}:${DB_PASSWORD:?set DB_PASSWORD in .env}@postgres:5432/${DB_NAME:-darkvoid}?sslmode=disable&x-migrations-table=schema_migrations_bot",
        "up",
      ]
    depends_on:
      migrate-notification:
        condition: service_completed_successfully

  app:
    image: ghcr.io/jarviisha/darkvoid:latest
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      # GET, not --spider: /health only registers GET; wget --spider sends
      # HEAD, which chi answers with 405 and the check reports a broken link.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    env_file:
      - path: .env
        required: false
    environment:
      # App
      ENVIRONMENT: ${ENVIRONMENT:-production}

      # Database — points to the postgres container
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-darkvoid}
      DB_SSLMODE: disable

      # Redis — points to the redis container
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-10}

      # JWT
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}

      # Storage
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_BASE_URL: ${STORAGE_BASE_URL:-http://localhost:8080/static}
      STORAGE_LOCAL_DIR: /app/uploads

      # Mailer
      MAILER_PROVIDER: ${MAILER_PROVIDER:-nop}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate-bot:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Operator CLI — same image as app, run as a one-off inside the compose
  # network (DB reachable by service name). Ships with every deploy, so no
  # hand-installed binary. Usage:
  #   docker compose -f docker-compose.prod.yml --profile tools run --rm ctl user list
  ctl:
    image: ghcr.io/jarviisha/darkvoid:latest
    profiles: [tools]
    restart: "no"
    entrypoint: ["/app/darkvoidctl"]
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-darkvoid}
      DB_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy

  # Content bot — opt-in, so a deploy never starts posting by accident:
  #   docker compose -f docker-compose.prod.yml --profile bot up -d bot
  #   docker compose -f docker-compose.prod.yml logs -f bot
  #
  # The alternative is the systemd unit in cmd/bot/darkvoid-bot.service, which keeps
  # GEMINI_API_KEY and BOT_RUNNER_PASSWORD in a root-only file instead of this stack's
  # .env, and leaves the bot running when the app image is replaced. Pick one.
  #
  # BOT_API_BASE_URL must name the app service: inside a container localhost is the
  # container itself. Credentials come from .env and are not declared required here —
  # `${VAR:?}` is interpolated for the whole file before profiles are filtered, so it
  # would break every compose command for a deployment that does not run the bot. The
  # bot reports both missing variables itself on startup.
  bot:
    image: ghcr.io/jarviisha/darkvoid:latest
    profiles: [bot]
    restart: unless-stopped
    entrypoint: ["/app/bot"]
    env_file:
      - path: .env
        required: false
    environment:
      BOT_API_BASE_URL: http://app:8080/api/v1
      BOT_RUNNER_USERNAME: ${BOT_RUNNER_USERNAME:-bot_runner}
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads:
