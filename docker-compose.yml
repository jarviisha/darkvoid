# Full stack: app + PostgreSQL + Redis
# Usage: docker compose up -d
#
# Works out of the box with development defaults.
# Override any value by creating a .env file next to this file.
#
# Optional profiles (activate with --profile or COMPOSE_PROFILES in .env):
#   codohue  — CF recommender stack (qdrant + codohue-*): make docker-up-codohue
#   tools    — seed runner: make docker-seed
#   external — app-only mode (app-external service, infra outside this
#              compose project): make docker-up-app
#
# Port isolation: only the app port is bound to the host by default.
# Internal services (postgres, redis, qdrant, codohue-api) communicate over
# Docker's internal network and do not expose host ports, preventing conflicts
# with any services already running on your machine.
#
# To connect a local DB client or inspect Redis from the host, use:
#   docker compose exec postgres psql -U postgres darkvoid
#   docker compose exec redis redis-cli
# Or add a docker-compose.override.yml to expose specific ports temporarily.

# Shared shape of the app container; app and app-external differ only in
# environment (which infra they point at) and depends_on.
x-app-base: &app-base
  build: .
  restart: unless-stopped
  ports:
    - "${SERVER_PORT:-8080}:8080"
  healthcheck:
    # GET, not --spider: /health only registers GET; wget --spider sends
    # HEAD, which chi answers with 405 and the check reports a broken link.
    test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
    interval: 5s
    timeout: 5s
    retries: 10
    start_period: 10s
  env_file:
    - path: .env
      required: false
  volumes:
    - uploads:/app/uploads

x-redis-command: &redis-command
  - sh
  - -c
  - |
    if [ -n "$$REDIS_PASSWORD" ]; then
      exec redis-server --requirepass "$$REDIS_PASSWORD"
    fi
    exec redis-server

x-redis-healthcheck: &redis-healthcheck
  test:
    [
      "CMD-SHELL",
      'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi',
    ]
  interval: 5s
  timeout: 5s
  retries: 10

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-darkvoid}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-darkvoid}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: *redis-command
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck: *redis-healthcheck

  migrate-user:
    image: migrate/migrate:4
    restart: on-failure
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations/user",
        "-database",
        "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-darkvoid}?sslmode=disable&x-migrations-table=schema_migrations_user",
        "up",
      ]
    depends_on:
      postgres:
        condition: service_healthy

  migrate-post:
    image: migrate/migrate:4
    restart: on-failure
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations/post",
        "-database",
        "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-darkvoid}?sslmode=disable&x-migrations-table=schema_migrations_post",
        "up",
      ]
    depends_on:
      migrate-user:
        condition: service_completed_successfully

  migrate-notification:
    image: migrate/migrate:4
    restart: on-failure
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations/notification",
        "-database",
        "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-darkvoid}?sslmode=disable&x-migrations-table=schema_migrations_notification",
        "up",
      ]
    depends_on:
      migrate-post:
        condition: service_completed_successfully

  app:
    <<: *app-base
    environment:
      # App
      ENVIRONMENT: ${ENVIRONMENT:-development}

      # Database — points to the postgres container
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-darkvoid}
      DB_SSLMODE: disable

      # Redis — points to the redis container
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-10}

      # JWT
      JWT_SECRET: ${JWT_SECRET:-darkvoid-dev-secret}

      # Storage
      STORAGE_PROVIDER: local
      STORAGE_BASE_URL: ${STORAGE_BASE_URL:-http://localhost:8080/static}
      STORAGE_LOCAL_DIR: /app/uploads

      # Mailer
      MAILER_PROVIDER: ${MAILER_PROVIDER:-nop}

      # Codohue CF recommender (active only when CODOHUE_ENABLED=true)
      CODOHUE_ENABLED: ${CODOHUE_ENABLED:-false}
      CODOHUE_BASE_URL: ${CODOHUE_DOCKER_BASE_URL:-http://codohue-api:2001}
      CODOHUE_ADMIN_URL: ${CODOHUE_DOCKER_ADMIN_URL:-http://codohue-admin:2002}
      CODOHUE_NAMESPACE_KEY: ${CODOHUE_NAMESPACE_KEY:-}
      CODOHUE_ADMIN_KEY: ${CODOHUE_ADMIN_KEY:-${CODOHUE_API_KEY:-${CODOHUE_NAMESPACE_KEY:-}}}
      CODOHUE_NAMESPACE: ${CODOHUE_NAMESPACE:-darkvoid_feed}
      CODOHUE_EMBEDDING_DIM: ${CODOHUE_EMBEDDING_DIM:-64}
      CODOHUE_DENSE_SOURCE: ${CODOHUE_DENSE_SOURCE:-byoe}
    depends_on:
      postgres:
        condition: service_healthy
      migrate-notification:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # App-only mode — same image, but PostgreSQL/Redis/Codohue live outside this
  # compose project (defaults reach the host via host.docker.internal; override
  # EXTERNAL_* in .env). No depends_on: nothing else starts with it.
  # Start with: make docker-up-app
  app-external:
    <<: *app-base
    profiles: [external]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: ${EXTERNAL_DB_HOST:-host.docker.internal}
      DB_PORT: ${EXTERNAL_DB_PORT:-5432}
      DB_SSLMODE: ${EXTERNAL_DB_SSLMODE:-disable}
      REDIS_HOST: ${EXTERNAL_REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${EXTERNAL_REDIS_PORT:-6379}
      CODOHUE_BASE_URL: ${EXTERNAL_CODOHUE_BASE_URL:-http://host.docker.internal:2001}
      CODOHUE_ADMIN_URL: ${EXTERNAL_CODOHUE_ADMIN_URL:-http://host.docker.internal:2002}
      STORAGE_LOCAL_DIR: /app/uploads

  seed:
    build: .
    profiles: [tools]
    restart: "no"
    entrypoint: ["/app/seed"]
    command:
      [
        "--posts=${SEED_POSTS:-500}",
        "--likes-per-post=${SEED_LIKES_PER_POST:-40}",
        "--comments-per-post=${SEED_COMMENTS_PER_POST:-5}",
      ]
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-darkvoid}
      DB_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
      migrate-notification:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Codohue profile — start with: make docker-up-codohue
  # ---------------------------------------------------------------------------

  qdrant:
    image: qdrant/qdrant:v1.17.1
    profiles: [codohue]
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  codohue-migrate:
    image: jarviisha/codohue-migrate:latest
    profiles: [codohue]
    restart: on-failure
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-darkvoid}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  codohue-api:
    image: jarviisha/codohue-api:latest
    profiles: [codohue]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-darkvoid}?sslmode=disable
      # Reuses DarkVoid's redis; override CODOHUE_REDIS_URL if redis has a password
      REDIS_URL: ${CODOHUE_REDIS_URL:-redis://redis:6379}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6334"
      CODOHUE_ADMIN_API_KEY: ${CODOHUE_ADMIN_KEY:-${CODOHUE_API_KEY:-${CODOHUE_NAMESPACE_KEY:-}}}
      CODOHUE_LOG_FORMAT: json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      codohue-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  codohue-admin:
    image: jarviisha/codohue-admin:latest
    profiles: [codohue]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-darkvoid}?sslmode=disable
      REDIS_URL: ${CODOHUE_REDIS_URL:-redis://redis:6379}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6334"
      CODOHUE_ADMIN_API_KEY: ${CODOHUE_ADMIN_KEY:-${CODOHUE_API_KEY:-${CODOHUE_NAMESPACE_KEY:-}}}
      CODOHUE_API_URL: http://codohue-api:2001
      # Pin so admin sessions survive container restarts; ephemeral when empty.
      CODOHUE_ADMIN_SESSION_SECRET: ${CODOHUE_ADMIN_SESSION_SECRET:-}
      CODOHUE_LOG_FORMAT: json
    depends_on:
      codohue-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  # Embedder worker — only does work when CODOHUE_DENSE_SOURCE=catalog
  # (drains the catalog auto-embedding queue); idle in byoe mode.
  codohue-embedder:
    image: jarviisha/codohue-embedder:latest
    profiles: [codohue]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-darkvoid}?sslmode=disable
      REDIS_URL: ${CODOHUE_REDIS_URL:-redis://redis:6379}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6334"
      CODOHUE_LOG_FORMAT: json
    depends_on:
      codohue-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  codohue-cron:
    image: jarviisha/codohue-cron:latest
    profiles: [codohue]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-darkvoid}?sslmode=disable
      REDIS_URL: ${CODOHUE_REDIS_URL:-redis://redis:6379}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6334"
      CODOHUE_LOG_FORMAT: json
      CODOHUE_BATCH_INTERVAL_MINUTES: "5"
    depends_on:
      codohue-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  uploads:
  qdrant_data:
