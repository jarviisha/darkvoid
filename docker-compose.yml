# Full stack: app + PostgreSQL + Redis
# Usage: docker compose up -d
#
# Works out of the box with development defaults.
# Override any value by creating a .env file next to this file.
#
# Optional profiles (activate with --profile or COMPOSE_PROFILES in .env):
#   tools    — seed runner: make docker-seed
#   bot      — AI content bot: make docker-up-bot
#   external — app-only mode (app-external service, infra outside this
#              compose project): make docker-up-app
#
# Codohue is deliberately NOT here. This project consumes it over the network —
# HTTP for recommendations and ingest, a Redis Stream for behavior events — and
# owns none of its containers, its Qdrant, or its schema. Run it from its own
# compose project and point CODOHUE_BASE_URL / CODOHUE_ADMIN_URL at it; see
# docker-compose.codohue.yml for the network-joining case.
#
# Port isolation: only the app port is bound to the host by default.
# Internal services (postgres, redis) communicate over
# Docker's internal network and do not expose host ports, preventing conflicts
# with any services already running on your machine.
#
# To connect a local DB client or inspect Redis from the host, use:
#   docker compose exec postgres psql -U postgres darkvoid
#   docker compose exec redis redis-cli
# Or add a docker-compose.override.yml to expose specific ports temporarily.

# Shared shape of the app container; app and app-external differ only in
# environment (which infra they point at) and depends_on.
x-app-base: &app-base
  build: .
  restart: unless-stopped
  # Codohue runs outside this project, so every container that talks to it needs
  # a route back to the host. Harmless when Codohue is elsewhere entirely.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  ports:
    - "${SERVER_PORT:-8080}:8080"
  healthcheck:
    # GET, not --spider: /health only registers GET; wget --spider sends
    # HEAD, which chi answers with 405 and the check reports a broken link.
    test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
    interval: 5s
    timeout: 5s
    retries: 10
    start_period: 10s
  env_file:
    - path: .env
      required: false
  volumes:
    - uploads:/app/uploads

x-redis-command: &redis-command
  - sh
  - -c
  - |
    if [ -n "$$REDIS_PASSWORD" ]; then
      exec redis-server --requirepass "$$REDIS_PASSWORD"
    fi
    exec redis-server

x-redis-healthcheck: &redis-healthcheck
  test:
    [
      "CMD-SHELL",
      'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi',
    ]
  interval: 5s
  timeout: 5s
  retries: 10

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-darkvoid}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-darkvoid}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: *redis-command
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck: *redis-healthcheck

  migrate-user:
    image: migrate/migrate:4
    restart: on-failure
    volumes:
      - ./migrations:/migrations:ro
    environment:
      # Out of band rather than inside the -database URL: a credential in argv is
      # visible to anyone who can run `docker inspect`, and a password inside a
      # postgres:// string is what secret scanners match on — by shape, whatever
      # value sits there. lib/pq reads PGPASSWORD, verified against migrate/migrate:4.
      PGPASSWORD: ${DB_PASSWORD:-postgres}
    command:
      [
        "-path",
        "/migrations/user",
        "-database",
        "postgres://${DB_USER:-postgres}@postgres:5432/${DB_NAME:-darkvoid}?sslmode=disable&x-migrations-table=schema_migrations_user",
        "up",
      ]
    depends_on:
      postgres:
        condition: service_healthy

  migrate-post:
    image: migrate/migrate:4
    restart: on-failure
    volumes:
      - ./migrations:/migrations:ro
    environment:
      # Out of band rather than inside the -database URL: a credential in argv is
      # visible to anyone who can run `docker inspect`, and a password inside a
      # postgres:// string is what secret scanners match on — by shape, whatever
      # value sits there. lib/pq reads PGPASSWORD, verified against migrate/migrate:4.
      PGPASSWORD: ${DB_PASSWORD:-postgres}
    command:
      [
        "-path",
        "/migrations/post",
        "-database",
        "postgres://${DB_USER:-postgres}@postgres:5432/${DB_NAME:-darkvoid}?sslmode=disable&x-migrations-table=schema_migrations_post",
        "up",
      ]
    depends_on:
      migrate-user:
        condition: service_completed_successfully

  migrate-notification:
    image: migrate/migrate:4
    restart: on-failure
    volumes:
      - ./migrations:/migrations:ro
    environment:
      # Out of band rather than inside the -database URL: a credential in argv is
      # visible to anyone who can run `docker inspect`, and a password inside a
      # postgres:// string is what secret scanners match on — by shape, whatever
      # value sits there. lib/pq reads PGPASSWORD, verified against migrate/migrate:4.
      PGPASSWORD: ${DB_PASSWORD:-postgres}
    command:
      [
        "-path",
        "/migrations/notification",
        "-database",
        "postgres://${DB_USER:-postgres}@postgres:5432/${DB_NAME:-darkvoid}?sslmode=disable&x-migrations-table=schema_migrations_notification",
        "up",
      ]
    depends_on:
      migrate-post:
        condition: service_completed_successfully

  migrate-bot:
    image: migrate/migrate:4
    restart: on-failure
    volumes:
      - ./migrations:/migrations:ro
    environment:
      # Out of band rather than inside the -database URL: a credential in argv is
      # visible to anyone who can run `docker inspect`, and a password inside a
      # postgres:// string is what secret scanners match on — by shape, whatever
      # value sits there. lib/pq reads PGPASSWORD, verified against migrate/migrate:4.
      PGPASSWORD: ${DB_PASSWORD:-postgres}
    command:
      [
        "-path",
        "/migrations/bot",
        "-database",
        "postgres://${DB_USER:-postgres}@postgres:5432/${DB_NAME:-darkvoid}?sslmode=disable&x-migrations-table=schema_migrations_bot",
        "up",
      ]
    depends_on:
      migrate-notification:
        condition: service_completed_successfully

  app:
    <<: *app-base
    environment:
      # App
      ENVIRONMENT: ${ENVIRONMENT:-development}

      # Database — points to the postgres container
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-darkvoid}
      DB_SSLMODE: disable

      # Redis — points to the redis container
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-10}

      # JWT
      JWT_SECRET: ${JWT_SECRET:-darkvoid-dev-secret}

      # Storage
      STORAGE_PROVIDER: local
      STORAGE_BASE_URL: ${STORAGE_BASE_URL:-http://localhost:8080/static}
      STORAGE_LOCAL_DIR: /app/uploads

      # Mailer
      MAILER_PROVIDER: ${MAILER_PROVIDER:-nop}

      # Codohue CF recommender (active only when CODOHUE_ENABLED=true).
      #
      # Codohue lives outside this compose project, so the URLs are overridden
      # here rather than inherited from .env: .env answers "where is Codohue"
      # from the host's point of view, and inside a container localhost is the
      # container. The default reaches a Codohue published on the host; set
      # CODOHUE_DOCKER_BASE_URL when it is somewhere else.
      CODOHUE_ENABLED: ${CODOHUE_ENABLED:-false}
      CODOHUE_BASE_URL: ${CODOHUE_DOCKER_BASE_URL:-http://host.docker.internal:2001}
      CODOHUE_ADMIN_URL: ${CODOHUE_DOCKER_ADMIN_URL:-http://host.docker.internal:2002}
      CODOHUE_NAMESPACE_KEY: ${CODOHUE_NAMESPACE_KEY:-}
      CODOHUE_ADMIN_KEY: ${CODOHUE_ADMIN_KEY:-${CODOHUE_API_KEY:-${CODOHUE_NAMESPACE_KEY:-}}}
      CODOHUE_NAMESPACE: ${CODOHUE_NAMESPACE:-darkvoid_feed}
      CODOHUE_EMBEDDING_DIM: ${CODOHUE_EMBEDDING_DIM:-64}
      CODOHUE_DENSE_SOURCE: ${CODOHUE_DENSE_SOURCE:-byoe}
    depends_on:
      postgres:
        condition: service_healthy
      migrate-bot:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # App-only mode — same image, but PostgreSQL/Redis/Codohue live outside this
  # compose project (defaults reach the host via host.docker.internal; override
  # EXTERNAL_* in .env). No depends_on: nothing else starts with it.
  # Start with: make docker-up-app
  app-external:
    <<: *app-base
    profiles: [external]
    environment:
      DB_HOST: ${EXTERNAL_DB_HOST:-host.docker.internal}
      DB_PORT: ${EXTERNAL_DB_PORT:-5432}
      DB_SSLMODE: ${EXTERNAL_DB_SSLMODE:-disable}
      REDIS_HOST: ${EXTERNAL_REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${EXTERNAL_REDIS_PORT:-6379}
      CODOHUE_BASE_URL: ${EXTERNAL_CODOHUE_BASE_URL:-http://host.docker.internal:2001}
      CODOHUE_ADMIN_URL: ${EXTERNAL_CODOHUE_ADMIN_URL:-http://host.docker.internal:2002}
      STORAGE_LOCAL_DIR: /app/uploads

  seed:
    build: .
    profiles: [tools]
    restart: "no"
    entrypoint: ["/app/seed"]
    command:
      [
        "--posts=${SEED_POSTS:-500}",
        "--likes-per-post=${SEED_LIKES_PER_POST:-40}",
        "--comments-per-post=${SEED_COMMENTS_PER_POST:-5}",
      ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-darkvoid}
      DB_SSLMODE: disable
      # Seed provisions the Codohue namespace when CODOHUE_ENABLED=true, so it
      # needs the same container-side URLs as the app — .env's are written from
      # the host's point of view.
      CODOHUE_BASE_URL: ${CODOHUE_DOCKER_BASE_URL:-http://host.docker.internal:2001}
      CODOHUE_ADMIN_URL: ${CODOHUE_DOCKER_ADMIN_URL:-http://host.docker.internal:2002}
    depends_on:
      postgres:
        condition: service_healthy
      migrate-bot:
        condition: service_completed_successfully

  # Operator CLI — run one-off admin commands inside the compose network so the
  # DB is reachable by service name. Usage:
  #   docker compose --profile tools run --rm ctl user list
  #   docker compose --profile tools run --rm ctl user reset-password -username root -password 'New123'
  ctl:
    build: .
    profiles: [tools]
    restart: "no"
    entrypoint: ["/app/darkvoidctl"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-darkvoid}
      DB_SSLMODE: disable
      # `codohue reindex` sends posts to Codohue over HTTP, so ctl needs the
      # container-side URL for the same reason seed and app do.
      CODOHUE_BASE_URL: ${CODOHUE_DOCKER_BASE_URL:-http://host.docker.internal:2001}
      CODOHUE_ADMIN_URL: ${CODOHUE_DOCKER_ADMIN_URL:-http://host.docker.internal:2002}
    depends_on:
      postgres:
        condition: service_healthy

  # Content bot — opt-in, so a plain `docker compose up` never starts posting.
  #   make docker-up-bot        (or: docker compose --profile bot up -d bot)
  #   make docker-logs-bot
  #
  # BOT_API_BASE_URL must name the app service, not localhost: inside a container
  # localhost is the container itself, so the default would make the bot dial
  # nothing. Everything else it needs — interval, personas, topics, model chain —
  # comes from /bot/plan, so this service needs no configuration beyond credentials.
  #
  # GEMINI_API_KEY, BOT_RUNNER_PASSWORD, and BOT_PASSWORD are read from .env rather
  # than declared required here: `${VAR:?}` is interpolated for the whole file before
  # profiles are filtered, so it would break every compose command for people not
  # running the bot. The bot reports the missing variables itself on startup.
  bot:
    build: .
    profiles: [bot]
    restart: unless-stopped
    entrypoint: ["/app/bot"]
    env_file:
      - path: .env
        required: false
    environment:
      BOT_API_BASE_URL: http://app:8080/api/v1
      BOT_RUNNER_USERNAME: ${BOT_RUNNER_USERNAME:-bot_runner}
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads:
